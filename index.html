<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KH Chinese – Thư viện luyện thi HSK & HSKK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EE;
    --paper:#FFFDF8;
    --rose:#D9838C;
    --rose-soft:#F3DADC;
    --rose-line:#E8B4B9;
    --gold:#C9A24A;
    --gold-soft:#F1E4C3;
    --red:#C8262A;
    --wine:#8E3443;
    --ink:#4A2A30;
    --muted:#8A6B70;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Be Vietnam Pro",system-ui,sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ===== HERO ===== */
  .hero{
    position:relative;
    text-align:center;
    padding:56px 20px 40px;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(201,162,74,.16), transparent 55%),
      radial-gradient(circle at 15% 90%, rgba(217,131,140,.14), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(217,131,140,.12), transparent 40%);
    pointer-events:none;
  }
  .hero > *{position:relative}
  .logo{width:180px;height:auto;display:block;margin:0 auto 18px;border-radius:24px}
  .hero h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(28px,4.6vw,44px);
    color:var(--wine);
    letter-spacing:.5px;
    line-height:1.2;
  }
  .hero h1 .zh{font-family:"Noto Serif SC",serif;color:var(--red);font-size:.8em;margin-left:6px}
  .hero p{max-width:560px;margin:12px auto 0;color:var(--muted);font-size:16px}
  .divider{
    display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto 0;max-width:280px
  }
  .divider span{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  .divider i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(200,38,42,.12)}

  /* ===== LEVEL NAV ===== */
  .levels{
    position:sticky;top:0;z-index:10;
    background:rgba(250,246,238,.92);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rose-soft);
  }
  .levels ul{
    list-style:none;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    max-width:1100px;margin:0 auto;padding:12px 16px;
  }
  .levels a{
    display:inline-block;padding:8px 18px;border-radius:999px;
    font-weight:600;font-size:14px;color:var(--wine);
    background:var(--paper);border:1.5px solid var(--rose-line);
    transition:all .2s ease;
  }
  .levels a:hover{background:var(--rose);color:#fff;border-color:var(--rose)}
  .levels a.hskk{border-color:var(--gold);color:#8a6a1f}
  .levels a.hskk:hover{background:var(--gold);color:#fff}

  /* ===== SECTIONS ===== */
  main{max-width:1100px;margin:0 auto;padding:36px 20px 64px}
  section{scroll-margin-top:80px;margin-bottom:44px}
  .sec-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .badge{
    flex:none;width:64px;height:64px;border-radius:16px;
    display:grid;place-items:center;
    background:var(--rose);color:#fff;
    font-family:"Noto Serif SC",serif;font-size:30px;font-weight:700;
    box-shadow:0 6px 16px rgba(217,131,140,.35);
    position:relative;
  }
  .badge::after{
    content:"";position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;
    background:var(--red);border:2.5px solid var(--cream);
  }
  .gold .badge{background:var(--gold);box-shadow:0 6px 16px rgba(201,162,74,.35)}
  .wine .badge{background:var(--wine);box-shadow:0 6px 16px rgba(142,52,67,.3)}
  .sec-head h2{font-family:"Playfair Display",serif;font-size:28px;color:var(--wine);line-height:1.1}
  .sec-head p{color:var(--muted);font-size:14px;margin-top:4px}
  .sec-head .line{flex:1;height:1.5px;background:linear-gradient(90deg,var(--rose-line),transparent);align-self:center;margin-left:8px}
  .gold .sec-head .line{background:linear-gradient(90deg,var(--gold),transparent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

  .card{
    position:relative;display:flex;flex-direction:column;gap:10px;
    background:var(--paper);
    border:1.5px solid var(--rose-soft);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rose);
    transition:width .2s ease;
  }
  .gold .card::before{background:var(--gold)}
  .wine .card::before{background:var(--wine)}
  .card:hover,.card:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(142,52,67,.12);
    border-color:var(--rose-line);
    outline:none;
  }
  .gold .card:hover{border-color:var(--gold)}
  .card:hover::before{width:6px}
  .card .tag{
    align-self:flex-start;font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;background:var(--rose-soft);color:var(--wine);
  }
  .gold .card .tag{background:var(--gold-soft);color:#7a5c17}
  .card h3{font-size:17px;font-weight:600;color:var(--ink);line-height:1.35}
  .card .open{
    margin-top:auto;display:flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:600;color:var(--red);
  }
  .card .open svg{transition:transform .2s ease}
  .card:hover .open svg{transform:translate(2px,-2px)}

  .empty{
    border:1.5px dashed var(--rose-line);border-radius:var(--radius);
    padding:22px;text-align:center;color:var(--muted);font-size:14.5px;background:rgba(255,253,248,.6)
  }

  footer{
    text-align:center;padding:28px 20px 36px;color:var(--muted);font-size:13.5px;
    border-top:1px solid var(--rose-soft);
  }
  footer strong{color:var(--wine);font-family:"Playfair Display",serif;letter-spacing:1.5px}

  @media (max-width:560px){
    .hero{padding:40px 16px 28px}
    .logo{width:150px}
    .badge{width:54px;height:54px;font-size:25px}
    .sec-head h2{font-size:23px}
    .sec-head .line{display:none}
    .levels ul{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .levels ul::-webkit-scrollbar{display:none}
    .levels a{white-space:nowrap}
  }
</style>
</head>
